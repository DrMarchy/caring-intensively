<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10232b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caring Intensively">
<meta name="description" content="ICU billing, ECMO logbook and CICM CPD tracker for Dr Denzil Gill">
<title>Caring Intensively</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%2310232b'/%3E%3Cg fill='none' stroke-width='4.2' stroke-linecap='round'%3E%3Cpath d='M14.5 13c4.5 6 4.5 16 0 22' stroke='%2345d8bc'/%3E%3Cpath d='M23 13c4.5 6 4.5 16 0 22' stroke='%23ff5d63'/%3E%3Cpath d='M31.5 13c4.5 6 4.5 16 0 22' stroke='%23ffbb4d'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --ink: #10232b;
  --ink-2: #3d5157;
  --muted: #637579;
  --paper: #eef2f1;
  --surface: #ffffff;
  --line: #d8e0de;
  --line-2: #e7ecea;
  --bill: #13756d;
  --bill-soft: #dff0ed;
  --ecmo: #c21d2f;
  --ecmo-deep: #5a1f3a;
  --ecmo-soft: #f8e3e5;
  --cpd: #a86a05;
  --cpd-soft: #f6ead3;
  --good: #1a7f5a;
  --warn: #b4541a;
  --monitor: #0f1e24;
  --m-line: #23363d;
  --m-text: #d9e6e3;
  --m-dim: #7f9599;
  --m-bill: #45d8bc;
  --m-ecmo: #ff5d63;
  --m-cpd: #ffbb4d;
  --acc: var(--bill);
  --acc-soft: var(--bill-soft);
  --radius: 14px;
  --tabh: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e4edeb; --ink-2: #b7c6c3; --muted: #8ea2a6; --paper: #0c171b; --surface: #14242a;
    --line: #26393f; --line-2: #1d2e34;
    --bill: #3cbfae; --bill-soft: #133a37; --ecmo: #f2646d; --ecmo-soft: #3d1b22; --cpd: #e5a63c; --cpd-soft: #3a2c12;
    --good: #43c08e; --warn: #f0954f; --monitor: #08131a; --m-line: #1e3138;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.4;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--acc) 60%, transparent); outline-offset: 2px; }
[data-mod="bill"] { --acc: var(--bill); --acc-soft: var(--bill-soft); }
[data-mod="ecmo"] { --acc: var(--ecmo); --acc-soft: var(--ecmo-soft); }
[data-mod="cpd"] { --acc: var(--cpd); --acc-soft: var(--cpd-soft); }

.app { max-width: 640px; margin: 0 auto; min-height: 100vh; padding: calc(var(--safe-t) + 8px) 16px calc(var(--tabh) + var(--safe-b) + 28px); }
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 0 14px; }
.topbar h1 { font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
.topbar .sp { flex: 1; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.wordmark { font-size: 26px; font-weight: 750; letter-spacing: -0.035em; }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 22px; height: 22px; }
.greet { margin: 2px 0 14px; }
.greet .d { color: var(--muted); font-size: 14px; }
.greet .h { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }

/* ---- Bedside-monitor dashboard panel ---- */
.monitor { background: var(--monitor); color: var(--m-text); border-radius: 18px; padding: 6px 0; margin-bottom: 18px; border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
.ch { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 16px 12px; border: 0; background: none; color: inherit; width: 100%; text-align: left; position: relative; }
.ch + .ch { border-top: 1px solid var(--m-line); }
.ch .lab { font-size: 13px; font-weight: 600; color: var(--c); letter-spacing: 0.01em; }
.ch .big { font-size: 46px; font-weight: 250; line-height: 1; color: var(--c); letter-spacing: -0.02em; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
.ch .big small { font-size: 18px; font-weight: 400; color: var(--m-dim); margin-left: 4px; letter-spacing: 0; }
.ch .unit { font-size: 13px; color: var(--m-dim); }
.ch .side { grid-row: 1 / span 3; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 6px; }
.ch .stat { font-size: 13px; color: var(--m-text); text-align: right; }
.ch .stat b { color: var(--c); font-weight: 600; font-size: 15px; }
.ch svg.spark { width: 128px; height: 40px; display: block; }
.ch .mbar { height: 5px; background: var(--m-line); border-radius: 3px; margin-top: 8px; position: relative; grid-column: 1 / -1; }
.ch .mbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); border-radius: 3px; }
.ch .mbar u { position: absolute; top: -4px; width: 2px; height: 13px; background: var(--m-text); opacity: .7; }
.ch.bill { --c: var(--m-bill); } .ch.ecmo { --c: var(--m-ecmo); } .ch.cpd { --c: var(--m-cpd); }

/* ---- Generic blocks ---- */
.sec { margin: 22px 0 10px; display: flex; align-items: baseline; gap: 10px; }
.sec h2 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
.sec .sp { flex: 1; }
.sec a, .link { color: var(--acc); font-weight: 600; font-size: 15px; text-decoration: none; background: none; border: 0; padding: 0; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; width: 100%; background: none; border: 0; text-align: left; }
.row + .row { border-top: 1px solid var(--line-2); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s.wrap { white-space: normal; }
.row .end { flex: none; text-align: right; color: var(--muted); font-size: 14px; }
.row.tap:active { background: var(--line-2); }
.thumb { width: 64px; height: 44px; border-radius: 8px; background: var(--line-2); flex: none; border: 1px solid var(--line); object-fit: cover; object-position: 8% 40%; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--line); flex: none; }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.pill.acc { background: var(--acc-soft); color: var(--acc); }
.codes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.code { font-size: 12.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--acc-soft); color: var(--acc); }
.empty { padding: 26px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
.note { font-size: 14px; color: var(--muted); margin: 10px 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card + .card { margin-top: 12px; }
.card h3 { margin: 0 0 4px; font-size: 17px; }
.card p { margin: 0 0 10px; color: var(--muted); font-size: 14.5px; }
.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; font-size: 14.5px; background: var(--surface); border: 1px dashed var(--line); }
.banner .main { flex: 1; }
.banner.demo { border: 1px solid color-mix(in srgb, var(--cpd) 45%, transparent); background: var(--cpd-soft); }

/* ---- Buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border-radius: 12px; border: 1px solid transparent; background: var(--acc); color: #fff; font-weight: 650; font-size: 16px; text-decoration: none; white-space: nowrap; }
.btn svg { width: 20px; height: 20px; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.soft { background: var(--acc-soft); color: var(--acc); }
.btn.danger { background: transparent; color: var(--ecmo); border-color: color-mix(in srgb, var(--ecmo) 40%, transparent); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14.5px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qa { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); text-align: left; min-height: 96px; }
.qa svg { width: 26px; height: 26px; color: var(--acc); }
.qa span { font-weight: 650; font-size: 15px; line-height: 1.2; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow > .btn { flex: 1; }

/* ---- Segmented / chips ---- */
.seg { display: flex; background: var(--line-2); border-radius: 12px; padding: 3px; margin-bottom: 14px; border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: 14.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 550; white-space: nowrap; min-height: 40px; }
.chip.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.chip.add { border-style: dashed; color: var(--acc); }

/* ---- Forms ---- */
.field { margin-bottom: 16px; }
.field > label, .flabel { display: block; font-size: 14px; font-weight: 650; color: var(--ink-2); margin-bottom: 7px; }
.field .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
input[type=text], input[type=email], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
textarea { min-height: 84px; resize: vertical; }
input[type=date], input[type=time] { min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.search { position: relative; margin-bottom: 12px; }
.search input { padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.toggle .main { flex: 1; }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--line); border: 0; position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.switch.on { background: var(--acc); }
.switch.on::after { left: 23px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.stepper button { width: 46px; height: 44px; border: 0; background: var(--surface); font-size: 22px; }
.stepper span { min-width: 46px; text-align: center; font-weight: 650; }

/* ---- Progress bars & charts ---- */
.prog { margin: 12px 0; }
.prog .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; margin-bottom: 6px; }
.prog .top b { font-weight: 650; }
.prog .top span { color: var(--muted); white-space: nowrap; }
.bar { height: 8px; border-radius: 4px; background: var(--line-2); position: relative; overflow: visible; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--acc); }
.bar u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; }
.bigprog .num { font-size: 44px; font-weight: 250; letter-spacing: -0.02em; line-height: 1; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
.bigprog .num small { font-size: 18px; color: var(--muted); font-weight: 400; }
.bigprog .bar { height: 14px; border-radius: 7px; margin: 14px 0 8px; }
.bigprog .bar i { border-radius: 7px; }
.hbars .hb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 0; border: 0; background: none; width: 100%; text-align: left; }
.hbars .hb + .hb { border-top: 1px solid var(--line-2); }
.hbars .hb .l { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbars .hb .l b { font-weight: 650; margin-right: 6px; }
.hbars .hb .v { font-size: 14.5px; font-weight: 650; }
.hbars .hb .bar { grid-column: 1 / -1; height: 6px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi .v { font-size: 28px; font-weight: 300; letter-spacing: -0.02em; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
.kpi .k { font-size: 13.5px; color: var(--muted); }
.colchart svg { width: 100%; height: 150px; display: block; }
.colchart .cap { font-size: 13.5px; color: var(--muted); min-height: 20px; margin-top: 6px; }
.checks .ck { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 15px; }
.checks .ck + .ck { border-top: 1px solid var(--line-2); }
.checks .ck .main { flex: 1; }
.checks .ck .sub { color: var(--muted); font-size: 13.5px; }
.cmark { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.cmark.ok { border-color: var(--good); background: var(--good); color: #fff; }
.cmark svg { width: 14px; height: 14px; }

/* ---- ECMO tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 10px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 112px; position: relative; }
.tile:active { background: var(--acc-soft); }
.tile .nm { font-weight: 650; font-size: 15px; line-height: 1.2; padding-right: 30px; }
.tile .plus { position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; }
.tile .plus svg { width: 16px; height: 16px; }
.tile .n { font-size: 30px; font-weight: 300; line-height: 1; margin-top: auto; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
.tile .n small { font-size: 14px; color: var(--muted); font-weight: 450; margin-left: 4px; }
.tile .bar { height: 5px; }

/* ---- Insights ---- */
.ins { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start; }
.ins + .ins { border-top: 1px solid var(--line-2); }
.ins .bullet { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--acc); }
.ins .main { flex: 1; font-size: 15px; }
.ins .main .btn { margin-top: 8px; }

/* ---- Tab bar ---- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabh); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 25px; height: 25px; }
.tabs button.on { color: var(--acc); }
.tabs button .badge { position: absolute; margin-left: 22px; margin-top: -26px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--ecmo); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }

/* ---- Full-screen pages and bottom sheets ---- */
.page { position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow-y: auto; -webkit-overflow-scrolling: touch; animation: pagein .22s ease-out; }
.page .in { max-width: 640px; margin: 0 auto; padding: calc(var(--safe-t) + 6px) 16px calc(var(--safe-b) + 40px); }
.page .head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-t) + 6px) 8px 8px; margin: calc(-1 * (var(--safe-t) + 6px)) -16px 8px; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.page .head .ttl { flex: 1; font-weight: 700; font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page .head .back { border: 0; background: none; color: var(--acc); font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 2px; padding: 8px; min-width: 80px; }
.page .head .back svg { width: 22px; height: 22px; }
.page .head .right { min-width: 80px; display: flex; justify-content: flex-end; }
@keyframes pagein { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(6, 16, 20, .42); animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-height: calc(100% - var(--safe-t) - 18px); display: flex; flex-direction: column; background: var(--paper); border-radius: 20px 20px 0 0; animation: up .24s cubic-bezier(.2,.8,.2,1); max-width: 640px; margin: 0 auto; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
.sheet.tall { height: calc(100% - var(--safe-t) - 18px); }
@keyframes up { from { transform: translateY(40%); opacity: .4; } }
.sheet .sh { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet .sh .ttl { flex: 1; min-width: 0; }
.sheet .sh .ttl b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet .sh .ttl span { display: block; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet .sb { flex: 1; overflow-y: auto; padding: 14px 16px 20px; -webkit-overflow-scrolling: touch; }
.sheet .sf { padding: 10px 16px calc(var(--safe-b) + 12px); border-top: 1px solid var(--line); background: var(--surface); }
.sheet .sf .sum { font-size: 13.5px; color: var(--muted); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.xbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--line-2); display: grid; place-items: center; padding: 0; flex: none; }
.xbtn svg { width: 18px; height: 18px; }
@media (prefers-reduced-motion: reduce) { .page, .sheet, .scrim { animation: none; } }

/* ---- Billing item picker ---- */
.daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.daynav input { flex: 1; text-align: center; font-weight: 650; }
.daynav .iconbtn { flex: none; }
.freq { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
.fq { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 11px; text-align: left; min-height: 58px; display: flex; flex-direction: column; justify-content: center; }
.fq b { font-size: 16px; }
.fq span { font-size: 12.5px; color: var(--muted); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fq.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.fq.on span { color: rgba(255,255,255,.85); }
.items .ih { font-size: 13.5px; font-weight: 700; color: var(--muted); margin: 18px 2px 8px; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 12px; min-height: 54px; background: var(--surface); }
.item + .item { border-top: 1px solid var(--line-2); }
.item .ck { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.item.on .ck { background: var(--acc); border-color: var(--acc); color: #fff; }
.item .ck svg { width: 16px; height: 16px; }
.item .tx { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; }
.item .tx b { font-size: 15.5px; margin-right: 6px; }
.item .tx span { font-size: 14.5px; }
.item .tx em { display: block; font-style: normal; font-size: 12.5px; color: var(--muted); }
.item .info { width: 40px; height: 40px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; padding: 0; }
.item .info svg { width: 22px; height: 22px; }
.suggest { border: 1px dashed color-mix(in srgb, var(--acc) 55%, transparent); background: var(--acc-soft); border-radius: 12px; padding: 12px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
.suggest .main { flex: 1; font-size: 14.5px; }
.warnbox { border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); font-size: 14px; margin-bottom: 10px; }
.warnbox div + div { margin-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 12px 0; }
.panel .flabel { margin-bottom: 8px; }

/* ---- Patient page ---- */
.photo { width: 100%; aspect-ratio: 16 / 7; border-radius: var(--radius); background: var(--line-2) center/contain no-repeat; border: 1px solid var(--line); display: block; object-fit: contain; background-color: #fff; }
.photo.none { display: grid; place-items: center; color: var(--muted); font-size: 14.5px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line-2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 12px 0; }
.facts div { background: var(--surface); padding: 10px 12px; min-width: 0; }
.facts div.wide { grid-column: 1 / -1; }
.facts small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.facts span { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; }
.viewer { position: fixed; inset: 0; z-index: 70; background: #000; display: flex; align-items: center; justify-content: center; overflow: auto; touch-action: pinch-zoom; }
.viewer img { max-width: 100%; max-height: 100%; }
.viewer .xbtn { position: fixed; top: calc(var(--safe-t) + 12px); right: 14px; background: rgba(255,255,255,.85); }

/* ---- Report preview ---- */
.pv-pages { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.pv-pages canvas { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.18); background: #fff; display: block; }
.sendbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }

/* ---- Toast ---- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + var(--safe-b) + 14px); z-index: 90; background: var(--ink); color: var(--paper); padding: 12px 14px 12px 16px; border-radius: 14px; display: flex; gap: 14px; align-items: center; font-size: 15px; max-width: calc(100% - 28px); width: max-content; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: up .2s ease-out; }
.toast button { background: none; border: 0; color: var(--m-bill); font-weight: 700; padding: 4px; }

/* ---- Welcome ---- */
.welcome { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--safe-t) + 30px) 22px calc(var(--safe-b) + 30px); max-width: 520px; margin: 0 auto; }
.welcome .mark { width: 76px; height: 76px; margin-bottom: 18px; }
.welcome h1 { font-size: 40px; margin: 0; letter-spacing: -0.04em; }
.welcome p.lead { font-size: 18px; color: var(--ink-2); margin: 8px 0 26px; }
.hide { display: none !important; }
.mt { margin-top: 14px; } .mt2 { margin-top: 24px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.right { text-align: right; }
.cap-list { list-style: none; padding: 0; margin: 0; }
.cap-list li { padding: 6px 0 6px 18px; position: relative; font-size: 14.5px; }
.cap-list li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }

/* ---- Label reading and locations ---- */
input.auto { background: var(--acc-soft); border-color: color-mix(in srgb, var(--acc) 45%, transparent); }
.ocrbox { display: flex; gap: 12px; align-items: flex-start; border-radius: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; }
.ocrbox.ok { background: var(--acc-soft); border-color: color-mix(in srgb, var(--acc) 35%, transparent); }
.ocrbox.warn { background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.ocrbox .main { flex: 1; min-width: 0; }
.ocrbox details { margin-top: 8px; }
.ocrbox summary { cursor: pointer; font-weight: 600; color: var(--acc); }
.ocrline { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid var(--line-2); }
.ocrline span { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
.ocrline .chip { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--acc); animation: spin .8s linear infinite; flex: none; margin-top: 1px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }
.locline { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 15px; }
.locline .main { flex: 1; min-width: 0; }

.estbill { padding: 0 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line-2); }
.estbill .v { font-size: 34px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.15; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }

.vh { position: absolute !important; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; left: -100px; }
</style>

const MBS_CRITERIA = {"13870": {"title": "ICU management by specialist – first day", "criteria": "Management of a patient in an ICU by a specialist or consultant physician on the first day of the ICU admission. It is a global daily fee that covers all ICU attendances (including by support medical staff), ECG monitoring, arterial sampling and bladder catheterisation on that day.", "rules": ["Must be provided by a specialist/consultant physician who is immediately available and exclusively rostered for intensive care (TN.1.11)", "'Immediately available' = predominantly present in the ICU during normal hours (absences up to about 2 h allowed if cover is in place); after hours, immediately contactable and able to return within a reasonable time. 'Exclusively rostered' = sole clinical commitment is intensive care (TN.1.9)", "Unit must meet the MBS ICU definition: can ventilate >24 h and do invasive cardiovascular monitoring; intensivist exclusively rostered in normal hours; doctor in hospital and immediately available 24/7; RN at least 18 h/day; defined admission/discharge policies (TN.1.9)", "Once per calendar day per patient, however many intensivists are involved; itemise by calendar day, not 24-h period (TN.1.9, TN.1.11)", "Do not bill for very short stays (about <2 h) with minimal ICU management (TN.1.11)", "Post-operative ICU admission is payable only where there is clear clinical justification for intensive care (TN.1.9)", "Not claimable with 13899 on the same day (TN.1.11)", "13839 (arterial puncture) is not payable in addition on the same day (TN.1.10)", "ECG monitoring, arterial sampling and bladder catheterisation are included – do not bill them separately", "Other specialists asked to attend (not managing the ICU care) can claim their own attendance items; endorse their account to show the consultation was not part of ICU management (TN.1.9)", "Patient moved between ICUs: the two units sort out billing between themselves (TN.1.11)"], "fee": 433.45, "verified" CU that meets TN.1.9, with an exclusively rostered ICU specialist", "Pressure monitoring outside the ICU by practitioners not associated with the ICU is item 11600, not 13876 (TN.1.11)", "The MBS has no letter suffixes. A/C/P/R on the form are the practice's own shorthand; on the Medicare claim, each pressure is a separate line of item 13876", "Billing more than one 13876 line on the same day will usually need Medicare's 'not duplicate service' override plus a note naming the pressure. This is general Medicare claiming practice, not an MBS note – confirm with the claiming software"], "fee": 92.05, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13876&qt=item"}, "13876A": {"title": "13876 – systemic arterial pressure (practice code A)", "criteria": "Practice shorthand for item 13876 claimed for continuous monitoring of systemic arterial pressure through an indwelling arterial line in ICU. 'A' is not an MBS suffix; claim it as 13876. All 13876 criteria apply.", "rules": ["Counts as 1 of the maximum 4 pressure types per calendar day", "Requires an exclusively rostered ICU specialist and an ICU that meets TN.1.9", "Arterial line insertion is a separate item (13842)"], "fee": 92.05, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13876&qt=item"}, "13876C": {"title": "13876 – central venous pressure (practice code C)", "criteria": "Practice shorthand for item 13876 claimed for continuous CVP monitoring through an indwelling central venous catheter in ICU. 'C' is not an MBS suffix; claim it as 13876. All 13876 criteria apply.", "rules": ["Counts as 1 of the maximum 4 pressure types per calendar day", "Requires an exclusively rostered ICU specialist and an ICU that meets TN.1.9", "CVC insertion is a separate item (13815)"], "fee": 92.05, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13876&qt=item"}, "13876P": {"title": "13876 – pulmonary arterial pressure (practice code P)", "criteria": "Practice shorthand for item 13876 claimed for continuous pulmonary arterial pressure monitoring through a PA catheter in ICU. 'P' is not an MBS suffix; claim it as 13876. All 13876 criteria apply.", "rules": ["Counts as 1 of the maximum 4 pressure types per calendar day", "PAWP is not listed as a separate MBS pressure type – it is measured through the same PA catheter (interpretation)", "PA catheter insertion, including wedge pressure and cardiac output measurement, is item 13818"], "fee": 92.05, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13876&qt=item"}, "13876R": {"title": "13876 – cardiac intracavity pressure (practice code R)", "criteria": "Practice shorthand for item 13876 claimed for continuous monitoring of a cardiac intracavity pressure (e.g. right atrial/right ventricular, or a left atrial line) in ICU. 'R' is not an MBS suffix; claim it as 13876. All 13876 criteria apply.", "rules": ["Counts as 1 of the maximum 4 pressure types per calendar day", "Caution: right atrial pressure read through the same CVC used for CVP is likely to be treated as the same pressure, so claiming both C and R from one catheter risks a duplicate claim (interpretation – not stated in MBS)", "Use only where a genuinely separate intracavity pressure is being continuously monitored"], "fee": 92.05, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13876&qt=item"}, "13857": {"title": "Airway + ventilation started outside ICU for ICU care", "criteria": "Establishing airway access and starting mechanical ventilation outside an ICU (e.g. ED, ward, MET call) so the patient can receive ventilatory support in an ICU. The descriptor does not limit who may perform it.", "rules": ["Not payable when started in the context of an anaesthetic for surgery, even if the patient will be ventilated in ICU afterwards – use the anaesthetic items instead (TN.1.10)", "No frequency limit is stated", "The in-ICU equivalent is 13881"], "fee": 175.25, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13857&qt=item"}, "13706": {"title": "Transfusion of blood or bone marrow already collected", "criteria": "Transfusion of blood or bone marrow that has already been collected. Per TN.1.7 this includes blood, platelets, white cells, bone marrow or gamma globulin.", "rules": ["Not payable when gamma globulin is given intramuscularly (TN.1.7)", "The item page states no frequency limit or co-claiming exclusion", "Descriptor last updated 1 Mar 2026"], "fee": 99.75, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13706&qt=item"}, "13815": {"title": "Central vein catheterisation (incl. US guidance)", "criteria": "Insertion of a central venous catheter by a percutaneous or open approach, including ultrasound guidance where clinically appropriate. A PICC qualifies only if its tip sits in a central vein (TN.1.6).", "rules": ["No separate ultrasound item is claimable (TN.1.10)", "Not for a service covered by item 13318 (descriptor)", "PICC tip must be in a central vein, not a peripheral vein (TN.1.6)", "No frequency limit is stated", "When a CVC is inserted as part of an anaesthetic, the RVG item 22020 is the listed equivalent (TN.10.1)"], "fee": 136.05, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13815&qt=item"}, "13842": {"title": "Intra-arterial cannulation (incl. US guidance)", "criteria": "Arterial cannulation, including ultrasound guidance where clinically appropriate, for intra-arterial pressure monitoring and/or arterial blood sampling.", "rules": ["No separate ultrasound item is claimable (TN.1.10)", "If done outside an ICU (e.g. with an anaesthetic), it is payable on top of 13870/13873 on the same day; endorse the account 'performed outside of an Intensive Care Unit' (TN.1.10)", "TN.1.10 does not say whether insertion inside the ICU is payable with 13870/13873 (those items include arterial sampling) – check with askMBS before relying on it"], "fee": 111.95, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13842&qt=item"}, "13818": {"title": "Right heart (PA) balloon catheter insertion", "criteria": "Insertion of a right heart balloon flotation (pulmonary artery) catheter, including pulmonary wedge pressure and cardiac output measurement.", "rules": ["Once per day, unless a second discrete operation is performed that day (TN.1.10)", "Ongoing PA pressure monitoring in ICU is billed under 13876 (pulmonary arterial pressure)"], "fee": 136.1, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13818&qt=item"}, "13848": {"title": "IABP counterpulsation management – each day", "criteria": "Daily management of intra-aortic balloon counterpulsation, including associated consultations and full haemodynamic assessment and management on several occasions during the day.", "rules": ["Claimable each day, including the first day (the separate first-day item 13847 was deleted in March 2020)", "Balloon insertion is not included – it is item 38609 (TN.1.10)", "No co-claiming restriction is stated"], "fee": 186.85, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13848&qt=item"}, "13885": {"title": "CVVH/CAVH management in ICU – first day", "criteria": "Management of continuous arteriovenous or venovenous haemofiltration in an ICU on the first day, by a specialist/consultant physician who is immediately available and exclusively rostered for intensive care.", "rules": ["FORM LABEL NOTE: this item covers management only and does not mention inserting the dialysis catheter. Vascular access would be billed under a separate item (e.g. 13815) – interpretation", "The MBS wording is 'haemofiltration'. CVVHD/CVVHDF are commonly billed under this item, but the descriptor does not name them (interpretation)", "Requires an exclusively rostered, immediately available ICU specialist (descriptor, TN.1.11)", "Once per day per patient (TN.1.9)"], "fee": 183.9, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13885&qt=item"}, "13888": {"title": "CVVH/CAVH management in ICU – each subsequent day", "criteria": "Management of continuous arteriovenous or venovenous haemofiltration in an ICU on each day after the first, by a specialist/consultant physician who is immediately available and exclusively rostered for intensive care.", "rules": ["Each day after the first day of haemofiltration management (descriptor)", "Requires an exclusively rostered ICU specialist (TN.1.11)", "Once per day per patient (TN.1.9)", "Patient must be in an ICU that meets TN.1.9"], "fee": 92.05, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13888&qt=item"}, "18216": {"title": "Epidural/intrathecal/CSE infusion – initial injection", "criteria": "Initial injection or start of an intrathecal, combined spinal-epidural or epidural infusion of a therapeutic substance, including up to 1 hour of continuous attendance by the practitioner.", "rules": ["Group T7 (regional blocks): used for pain or labour not associated with an operation, including labour epidurals. For >1 h of continuous attendance use 18219; after-hours labour equivalents are 18226/18227 (TN.10.7)", "Only one attendance: not claimable for a further attendance just to optimise (extend or improve) an existing block (TN.10.7)", "If the anaesthetist inserts it with anaesthesia and surgery for post-op pain, use RVG item 22031 instead", "Subsequent top-ups/revisions: 18222 (≤15 min attendance) or 18225 (>15 min)"], "fee": 227.3, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=18216&qt=item"}, "18225": {"title": "Regional catheter – subsequent injection/revision >15 min", "criteria": "A subsequent injection into, or revision of, a continuous catheter infusion of a therapeutic substance (not contrast) used to maintain regional anaesthesia or analgesia (e.g. an epidural), where the practitioner is in continuous attendance for more than 15 minutes.", "rules": ["FORM LABEL NOTE: not a 'daily maintenance' item – it is billed per subsequent injection/revision with >15 min of continuous attendance; ≤15 min is 18222", "Not payable to the operating surgeon in the post-op period, which counts as routine aftercare (TN.7.2)", "No daily frequency limit is stated on the item page"], "fee": 59.85, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=18225&qt=item"}, "104": {"title": "Specialist initial attendance (referred)", "criteria": "Initial attendance in a single course of treatment by a specialist practising in their specialty, at consulting rooms or in hospital, after the patient has been referred.", "rules": ["Valid referral required", "Not with items 106, 109, 125 or 16401 (descriptor)", "An intensivist billing 13870/13873 for the patient that day should not also bill 104 – the ICU fee covers all ICU attendances by the ICU specialist (TN.1.11; interpretation)", "A specialist asked to see an ICU patient who is not managing the ICU care may claim; endorse the account as not part of ICU management (TN.1.9)", "Several attendances on one day are payable only if each is not a continuation of the last and there is a reasonable gap; record the times (AN.0.7)", "Video equivalent is 91822 (AN.40.1)"], "fee": 103.95, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=104&qt=item"}, "105": {"title": "Specialist subsequent attendance (referred)", "criteria": "Any attendance after the initial one in a single course of treatment by a specialist practising in their specialty, at consulting rooms or in hospital, following referral.", "rules": ["Not with items 126 or 16404 (descriptor)", "Not payable for the same practitioner, patient and day as a Group T8 operation with a schedule fee above about $350 (AN.0.70 cites $349.95; AN.3.1 cites $359.05)", "Same ICU interaction as 104: not alongside the managing intensivist's own 13870/13873 (interpretation of TN.1.11)", "Multiple same-day attendances: AN.0.7 applies (not a continuation, reasonable gap, times recorded)", "Telehealth equivalents: video 91823, phone 91833"], "fee": 52.25, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=105&qt=item"}, "160": {"title": "Prolonged attendance – imminent danger of death, 1–2 h", "criteria": "Attendance by a GP, specialist or consultant physician on a patient in imminent danger of death, totalling at least 1 hour but less than 2 hours, where no other item applies.", "rules": ["FORM LABEL NOTE: this is not an 'initial consult' item – it needs a patient in imminent danger of death and at least 60 min of total attendance", "Attendance need not be continuous; the total time counts (AN.0.27)", "Each practitioner attending at the same time may claim (AN.0.27)", "Only where no other item applies (descriptor), so likely not for ICU patients whose care that day is billed by the same intensivist under 13870/13873 (interpretation)", "Longer time bands: 161 (2–3 h), 162 (3–4 h), 163 (4–5 h), 164 (≥5 h)"], "fee": 265.15, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=160&qt=item"}, "13899": {"title": "Goals of care outside ICU by intensivist (≥60 min)", "criteria": "At least 60 minutes spent preparing goals of care, outside an ICU, for a gravely ill patient who has no current goals of care, by an intensive care specialist who takes overall responsibility for preparing them. It requires a comprehensive evaluation, a capacity assessment, discussion with the patient or surrogate (offering alternatives to intensive or escalated care), and agreed goals recorded where other clinicians can readily find them.", "rules": ["FORM LABEL NOTE: not a general ward consult – it is specifically a ≥60-min goals-of-care service", "Gravely ill = life-threatening acute illness/injury, or acute illness plus high risk of death within 12 months; more than one management option is clinically appropriate; and there is no retrievable goals-of-care record, or the existing one is expected to change substantially (TN.1.11)", "Once per admission, counting ED goals-of-care items 5039/5041/5042/5044. Can be claimed again only if a later ICU referral or MET/cardiac arrest call substantively changes the clinical situation (TN.1.11)", "Not with 13870 or 13873 on the same day (TN.1.11)", "Not claimable if the goals of care cover only some of the patient's major issues (TN.1.11)", "Record on standard facility forms where available; provider should be trained in end-of-life/goals-of-care discussions (TN.1.11)"], "fee": 320.55, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13899&qt=item"}, "13400": {"title": "Cardioversion (not during cardiac surgery)", "criteria": "Restoring cardiac rhythm by electrical stimulation (cardioversion), other than during cardiac surgery.", "rules": ["The item page has no explanatory notes or co-claiming restrictions", "Carries an anaesthetic value: anaesthesia by a different practitioner is item 20410"], "fee": 115.95, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13400&qt=item"}, "38828": {"title": "Intercostal drain insertion (no rib resection)", "criteria": "Insertion of an intercostal drain, not involving rib resection and excluding aftercare.", "rules": ["Not with items 38815, 38816 or 38829–38834 (descriptor); 38829 is an intercostal drain with pleurodesis", "FORM LABEL NOTE: pleurocentesis is NOT this item – diagnostic aspiration is 38800 and therapeutic drainage is 38803", "Group T8 multiple operation rule applies: 100% / 50% / 25% for the 1st / 2nd / 3rd and later operations on one occasion (TN.8.2)", "Aftercare is excluded"], "fee": 159.9, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=38828&qt=item"}, "39000": {"title": "Lumbar puncture", "criteria": "Lumbar puncture.", "rules": ["Group T8 multiple operation rule applies (TN.8.2)", "No other item-specific rules on the page; has an anaesthetic value"], "fee": 90.1, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=39000&qt=item"}, "41880": {"title": "Tracheostomy – percutaneous technique", "criteria": "Tracheostomy performed by a percutaneous technique.", "rules": ["Percutaneous technique only; open tracheostomy is a different item (not verified here)", "Group T8 multiple operation rule applies (TN.8.2)", "Anaesthesia for the tracheostomy (20320) must be given by a different practitioner – anaesthesia items are not payable to the practitioner doing the procedure, except in special circumstances (TN.10.7)"], "fee": 304.15, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=41880&qt=item"}, "38419": {"title": "Bronchoscopy as an independent procedure", "criteria": "Bronchoscopy performed as an independent procedure.", "rules": ["'Independent procedure' – i.e. not done as part of another operation (interpretation)", "Group T8 multiple operation rule applies (TN.8.2)", "No ICU-specific notes or exclusions on the page"], "fee": 213.05, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=38419&qt=item"}, "13830": {"title": "Intracranial pressure monitoring – each day", "criteria": "Monitoring of intracranial pressure through an intraventricular or subdural catheter, subarachnoid bolt or similar, by a specialist or consultant physician, each day.", "rules": ["Daily item", "No explanatory notes or exclusions on the item page", "Covers monitoring only; the descriptor does not include inserting the device"], "fee": 90.15, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13830&qt=item"}, "13839": {"title": "Arterial puncture for diagnostic blood sample", "criteria": "Arterial puncture and collection of blood for diagnostic purposes.", "rules": ["Not payable in addition to 13870 or 13873 on the same day (TN.1.10)"], "fee": 27.65, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13839&qt=item"}, "13851": {"title": "Ventricular assist device management – first day", "criteria": "Management of a ventricular assist device on the first day, for a patient admitted to an ICU for implantation of the device or for complications of its implantation or management.", "rules": ["Excludes an intravascular microaxial VAD inserted into the right ventricle (descriptor)", "The ICU admission must be for implantation or for device complications", "Once per calendar day per patient, however many practitioners are involved (TN.1.10)", "Later days are 13854"], "fee": 590.8, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13851&qt=item"}, "13854": {"title": "Ventricular assist device management – each later day", "criteria": "Management of a ventricular assist device for a patient in an ICU, including complications of implantation or management, on each day after the first.", "rules": ["Excludes an intravascular microaxial VAD inserted into the right ventricle (descriptor)", "Once per calendar day per patient, however many practitioners are involved (TN.1.10)"], "fee": 137.45, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=13854&qt=item"}, "38256": {"title": "Temporary transvenous pacing electrode insertion", "criteria": "Insertion of a temporary transvenous pacemaking electrode.", "rules": ["Group T8 multiple operation rule applies (TN.8.2)", "No imaging requirement or exclusions on the item page"], "fee": 319.85, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=38256&qt=item"}, "17610": {"title": "Pre-anaesthesia consultation – brief (≤15 min)", "criteria": "A brief pre-anaesthesia consultation (15 minutes or less) by an anaesthetist: targeted history, limited examination including the cardiorespiratory system, and a brief discussion of the anaesthesia plan.", "rules": ["Payable even if the procedure does not go ahead (TN.6.1)", "Included in the anaesthetic unless it is a separate attendance away from the operating theatre/induction room (TN.10.7)", "Not with pain specialist items 2801–3000 (descriptor, TN.6.1)", "Only active time with the patient counts, not discussion with colleagues (TN.6.1)", "Longer/complex consults: 17615 (15–30 min), 17620 (30–45 min), 17625 (>45 min). These need advanced surgery or complex medical problems plus a written anaesthesia plan (TN.6.1)"], "fee": 52.25, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=17610&qt=item"}, "20745": {"title": "Anaes: complex upper GI endoscopy (bleed/ERCP/EUS/PEG/EMR)", "criteria": "Anaesthesia for upper GI endoscopy for acute GI haemorrhage, ERCP, upper GI endoscopic ultrasound, PEG, or endoscopic mucosal resection of a tumour. 7 basic units.", "rules": ["FORM LABEL NOTE: anaesthesia for routine upper GI endoscopy is 20740 (5 units); 20745 is only for the listed complex procedures", "Payable only with an eligible service, i.e. a procedure carrying an anaesthetic value (TN.10.2)", "Fee = basic units + time units (23010–24136) + any modifiers (25000–25050); $23.70 per unit in the 2026 schedule", "Not payable to the practitioner who performs the procedure, except in special circumstances (TN.10.7)", "Anaesthesia start and end times must be recorded in writing (TN.10.3)"], "fee": 165.9, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=20745&qt=item"}, "20320": {"title": "Anaes: neck procedures (incl. larynx/trachea)", "criteria": "Anaesthesia for procedures on the oesophagus, thyroid, larynx, trachea, lymphatic system, muscles, nerves or other deep tissues of the neck, where no other item in the subgroup applies. 6 basic units.", "rules": ["No tracheostomy-specific RVG item was found; tracheostomy falls under 'trachea' here", "Eligible service required (TN.10.2); fee = basic + time + modifiers", "Not payable to the practitioner doing the tracheostomy (TN.10.7)", "Start and end times must be recorded (TN.10.3)"], "fee": 142.2, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=20320&qt=item"}, "20520": {"title": "Anaes: closed chest procedures (incl. bronchoscopy)", "criteria": "Anaesthesia for all closed chest procedures, including rigid oesophagoscopy or bronchoscopy, where no other item in the intrathoracic subgroup applies. 6 basic units.", "rules": ["Eligible service required (TN.10.2); fee = basic + time + modifiers", "Not payable to the practitioner doing the bronchoscopy (TN.10.7)", "Start and end times must be recorded (TN.10.3)"], "fee": 142.2, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=20520&qt=item"}, "21936": {"title": "Anaes: transoesophageal echocardiography", "criteria": "Anaesthesia for a 2-dimensional real-time transoesophageal examination of the heart. 5 basic units.", "rules": ["Eligible service required (TN.10.2); fee = basic + time + modifiers", "Not payable to the practitioner doing the TOE (TN.10.7)", "Start and end times must be recorded (TN.10.3)"], "fee": 118.5, "verified": true, "source": "https://www9.health.gov.au/mbs/fullDisplay.cfm?type=item&q=21936&qt=item"}, "20410": {"title": "Anaes: electrical cardioversion", "criteria": "Anaesthesia for electrical conversion of arrhythmias (cardioversion). 4 basic units.", "rules": ["Eligible service required, e.g. 13400 (TN.10.2); fee = basic + time + modifiers", "Not payable to the practitioner who performs the cardioversion (TN.10.7)", "Start and end times must be recorded (TN.10.3)"], "fee": 94.8, "verified": true, "source": "https://www9.heal /* ---- Dates (local, as YYYY-MM-DD strings) ---- */
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => toISO(new Date());
const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const daysBetween = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 86400000);
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtDate = (s, opt = {}) => {
  if (!s) return '';
  const d = fromISO(s);
  const yr = opt.year || d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return (opt.dow === false ? '' : DOW[d.getDay()] + ' ') + d.getDate() + ' ' + MON[d.getMonth()] + yr;
};
const fmtDMY = (s) => { if (!s) return ''; const d = fromISO(s); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const fmtDM = (s) => { const d = fromISO(s); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const relDay = (s) => {
  const n = daysBetween(s, today());
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n === -1) return 'Tomorrow';
  return fmtDate(s);
};
const weekStart = (s) => { const d = fromISO(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return toISO(d); };
const monthStart = (s) => s.slice(0, 8) + '01';
const monthEnd = (s) => { const d = fromISO(monthStart(s)); d.setMonth(d.getMonth() + 1); d.setDate(0); return toISO(d); };
const minsBetween = (a, b) => {
  if (!a || !b) return null;
  const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number);
  let m = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (m < 0) m += 1440;
  return m;
};

/* Named ranges used across the app */
function rangeFor(key, ref = today()) {
  switch (key) {
    case 'today': return [ref, ref];
    case 'week': return [weekStart(ref), addDays(weekStart(ref), 6)];
    case 'lastweek': { const s = addDays(weekStart(ref), -7); return [s, addDays(s, 6)]; }
    case 'month': return [monthStart(ref), monthEnd(ref)];
    case 'lastmonth': { const d = fromISO(monthStart(ref)); d.setMonth(d.getMonth() - 1); const s = toISO(d); return [s, monthEnd(s)]; }
    case '30d': return [addDays(ref, -29), ref];
    case '90d': return [addDays(ref, -89), ref];
    case '12m': return [addDays(ref, -364), ref];
    case 'year': return [ref.slice(0, 4) + '-01-01', ref.slice(0, 4) + '-12-31'];
    case 'fy': { const y = Number(ref.slice(0, 4)), m = Number(ref.slice(5, 7)); const s = m >= 7 ? y : y - 1; return [s + '-07-01', (s + 1) + '-06-30']; }
    case 'all': return ['1900-01-01', '2999-12-31'];
    default: return [ref, ref];
  }
}
const RANGE_LABELS = { week: 'This week', lastweek: 'Last week', month: 'This month', lastmonth: 'Last month', '30d': 'Last 30 days', '90d': 'Last 90 days', '12m': 'Last 12 months', year: 'This year', fy: 'This financial year', all: 'All time', custom: 'Custom dates' };
const fmtRange = (a, b) => {
  if (a === '1900-01-01') return 'All records';
  if (a === b) return fmtDate(a, { year: true });
  return fmtDate(a, { dow: false, year: true }) + ' to ' + fmtDate(b, { dow: false, year: true });
};

/* ---- Storage: IndexedDB with an in-memory fallback ---- */
const Store = {
  db: null, ok: false, mem: { kv: {}, photos: {} },
  async open() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('gills', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('photos'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('idb timeout')), 4000);
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode); const os = t.objectStore(store);
        const r = fn(os); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  },
  async get(store, key) {
    if (!this.ok) return this.mem[store][key];
    try { return await this._tx(store, 'readonly', (os) => os.get(key)); } catch (e) { return this.mem[store][key]; }
  },
  async put(store, key, val) {
    this.mem[store][key] = val;
    if (!this.ok) return;
    try { await this._tx(store, 'readwrite', (os) => os.put(val, key)); } catch (e) { /* keep in memory */ }
  },
  async del(store, key) {
    delete this.mem[store][key];
    if (!this.ok) return;
    try { await this._tx(store, 'readwrite', (os) => os.delete(key)); } catch (e) { }
  },
  async keys(store) {
    if (!this.ok) return Object.keys(this.mem[store]);
    try { return await this._tx(store, 'readonly', (os) => os.getAllKeys()); } catch (e) { return Object.keys(this.mem[store]); }
  },
  async clear(store) {
    this.mem[store] = {};
    if (!this.ok) return;
    try { await this._tx(store, 'readwrite', (os) => os.clear()); } catch (e) { }
  }
};

function newCanvas() {

      const t = line ? line + ' ' + w : w;
      if (x.measureText(t).width <= maxW || !line) {
        if (!line && x.measureText(w).width > maxW) { // hard-break a long word

}

  }
  signature(lines) {
    this.room(200); this.y += 30;
    const W = (PAGE_W - this.M * 2 - 40) / 2;
    lines.forEach((l, i) => {
      const cx = this.M + (i % 2) * (W + 40);
      if (i % 2 === 0 && i > 0) this.y += 90;
      this.x.fillStyle = RULE; this.x.fillRect(cx, this.y + 50, W, 1.5);
      setFont(this.x, 16, 500); this.x.fillStyle = SOFT; this.x.fillText(l, cx, this.y + 74);
    });
    this.y += 100;
  }
  finish(foot) {
    this.pages.forEach((c, i) => {
      const x = c.getContext('2d'); setFont(x, 14, 400); x.fillStyle = SOFT;
      x.fillText(foot, this.M, PAGE_H - 50);
      x.textAlign = 'right'; x.fillText('Page ' + (i + 1) + ' of ' + this.pages.length, PAGE_W - this.M, PAGE_H - 50); x.textAlign = 'left';
    });
    return this.pages;
  }
}

/* ---------- The billing sheet, laid out like Denzil's paper form ---------- */
async function drawBillingSheet(patient, dates, pageNo, hospId) {
  const c = newCanvas(); const x = c.getContext('2d');
  const byDate = {}; dates.forEach((d) => { if (d) byDate[d] = dayFor(patient.id, d); });
  const used = dates.filter((d) => d && byDate[d]);
  const locs = used.map((d) => dayLoc(byDate[d]));
  const hosp = hospitalById(hospId || (locs[0] || patientLoc(patient)).hospital);
  const L = 66, R = PAGE_W - 66, W = R - L;
  const moved = locs.some((l) => !sameLoc(l, locs[0]));

  // Label box
  const lb = { x: L, y: 56, w: 560, h: 236 };
  const im = await loadImage(await photoForPatient(patient));
  x.fillStyle = '#e9e9e9'; x.fillRect(lb.x, lb.y, lb.w, lb.h);
  if (im) { x.fillStyle = '#fff'; x.fillRect(lb.x, lb.y, lb.w, lb.h); drawImageContain(x, im, lb.x + 4, lb.y + 4, lb.w - 8, lb.h - 8); }
  else {
    setFont(x, 26, 700); x.fillStyle = INK; x.fillText(fitText(x, patientName(patient), lb.w - 40), lb.x + 20, lb.y + 60);
    setFont(x, 20, 400);
    [patient.ur ? 'UR ' + patient.ur : '', patient.fund ? 'Fund: ' + patient.fund : '', 'No label photo'].filter(Boolean).forEach((t, i) => x.fillText(t, lb.x + 20, lb.y + 100 + i * 32));
  }
  // Details box
  const db = { x: L + 590, y: 66, w: W - 590, h: 226 };
  x.strokeStyle = RULE; x.lineWidth = 2; x.strokeRect(db.x, db.y, db.w, db.h);
  const wb = locs.length ? (moved ? 'Moved, see the ward / bed row' : wardBed(locs[0])) : wardBed(patientLoc(patient));
  const rows = [['Referring Doctor:', patient.refDoc], ['Ward / Bed:', wb], ['Admission Dx:', patient.dx], ['Health fund:', patient.fund], ['Patient:', patientName(patient) + (patient.ur ? ', UR ' + patient.ur : '')]];
  rows.forEach(([k, v], i) => {
    const yy = db.y + 40 + i * 40;
    setFont(x, 19, 400); x.fillStyle = '#3b4a50'; x.fillText(k, db.x + 18, yy);
    const kw = x.measureText(k).width;
    setFont(x, 19, 600); x.fillStyle = INK; x.fillText(fitText(x, v || '', db.w - kw - 46), db.x + 26 + kw, yy);
  });

  // Table geometry
  const colCode = 112, colDesc = 520, nDay = 7;
  const dayW = (W - colCode - colDesc) / nDay;
  const top = 320, headH = 52;
  const extras = Array.from(new Set(dates.flatMap((d) => byDate[d] ? byDate[d].items : []))).filter((cd) => ITEM_MAP[cd] && !ITEM_MAP[cd].form);
  const formRows = [{ pseudo: 'loc' }];
  FORM_ITEMS.forEach(([code, sec], i) => {
    const prev = i ? FORM_ITEMS[i - 1][1] : sec;
    if (code === '25014') { formRows.push({ pseudo: 'time' }); formRows.push({ pseudo: 'asa' }); }
    formRows.push({ code, thick: sec !== prev });
  });
  extras.forEach((cd, i) => formRows.push({ code: cd, thick: i === 0 }));
  const noteDays = dates.filter((d) => d && byDate[d] && byDate[d].note);
  const footReserve = 150 + (noteDays.length ? 60 : 0);
  const nUnits = formRows.reduce((a, r) => a + (r.pseudo === 'time' || r.pseudo === 'loc' ? 2 : 1), 0);
  const rowH = Math.min(30, Math.floor((PAGE_H - top - headH - footReserve) / nUnits));

  // Header row
  x.strokeStyle = RULE; x.lineWidth = 2.4;
  x.strokeRect(L, top, W, headH);
  setFont(x, 19, 700); x.fillStyle = INK;
  x.fillText('MBS #', L + 14, top + 33);
  const firstDate = dates.find(Boolean) || today();
  const fd = fromISO(firstDate);
  x.fillText(fitText(x, hosp.name.toUpperCase(), 250), L + colCode + 12, top + 33);
  setFont(x, 17, 700);
  x.fillText('Month: ' + MON[fd.getMonth()], L + colCode + 280, top + 33);
  x.fillText('Year: ' + fd.getFullYear(), L + colCode + 410, top + 33);
  dates.forEach((d, i) => {
    const cx = L + colCode + colDesc + i * dayW;
    if (d) {
      const dd = fromISO(d);
      setFont(x, 17, 700); x.textAlign = 'center'; x.fillStyle = INK;
      x.fillText(fmtDM(d), cx + dayW / 2, top + 24);
      setFont(x, 13, 500); x.fillStyle = SOFT; x.fillText(DOW[dd.getDay()], cx + dayW / 2, top + 43);
      x.textAlign = 'left';
    }
  });

  // Body rows
  let y = top + headH;
  formRows.forEach((r) => {
    const h = r.pseudo === 'time' || r.pseudo === 'loc' ? rowH * 2 : rowH;
    if (r.thick) { x.fillStyle = RULE; x.fillRect(L, y - 1.5, W, 3); }
    x.fillStyle = INK;
    if (r.pseudo === 'loc') {
      x.fillStyle = '#f1f4f3'; x.fillRect(L, y, W, h); x.fillStyle = INK;
      setFont(x, 16, 700); x.fillText('Ward / bed', L + colCode + 10, y + rowH - 8);
      setFont(x, 12, 400); x.fillStyle = SOFT; x.fillText(moved ? 'Patient moved during these days' : 'Location for each day of care', L + colCode + 10, y + rowH * 2 - 9);
    } else if (r.pseudo === 'time') {
      setFont(x, 16, 400); x.fillText('Time modifier:', L + colCode + 10, y + rowH - 8);
      setFont(x, 15, 700); x.fillText('START', L + colCode + 160, y + rowH - 8); x.fillText('FINISH', L + colCode + 340, y + rowH - 8);
      setFont(x, 12, 400); x.fillStyle = SOFT; x.fillText('Start / finish times and time item for each day', L + colCode + 10, y + rowH * 2 - 9);
    } else if (r.pseudo === 'asa') {
      setFont(x, 16, 400); x.fillText('ASA modifier:', L + colCode + 10, y + rowH - 8);
    } else {
      const it = ITEM_MAP[r.code] || { label: r.code };
      setFont(x, 16, 500); x.fillText(r.code, L + 12, y + rowH - 8);
      setFont(x, 16, 400);
      const label = it.label; const hint = it.hint ? ' (' + it.hint + ')' : '';
      const lw = x.measureText(label).width;
      if (lw > colDesc - 20) {
        let fs = 16; while (fs > 12.5) { fs -= 0.5; setFont(x, fs, 400); if (x.measureText(label).width <= colDesc - 20) break; }
        x.fillText(fitText(x, label, colDesc - 20), L + colCode + 10, y + rowH - 8);
      }
      else {
        x.fillText(label, L + colCode + 10, y + rowH - 8);
        if (hint) { setFont(x, 11.5, 400); x.fillText(fitText(x, hint, colDesc - 26 - lw), L + colCode + 14 + lw, y + rowH - 8); }
      }
    }
    // day cells
    dates.forEach((d, i) => {
      const cx = L + colCode + colDesc + i * dayW;
      const day = d && byDate[d];
      if (!day) return;
      x.textAlign = 'center'; x.fillStyle = INK;
      if (r.pseudo === 'loc') {
        const l = dayLoc(day); const prev = i > 0 && dates[i - 1] && byDate[dates[i - 1]] ? dayLoc(byDate[dates[i - 1]]) : null;
        const changedHere = prev && !sameLoc(prev, l);
        setFont(x, 13.5, changedHere ? 800 : 600);
        x.fillText(fitText(x, l.ward || '\u2013', dayW - 6), cx + dayW / 2, y + rowH * 0.78);
        setFont(x, 12.5, changedHere ? 700 : 400);
        x.fillText(fitText(x, l.bed ? 'Bed ' + l.bed : '', dayW - 6), cx + dayW / 2, y + rowH * 1.55);
      } else if (r.pseudo === 'time') {
        if (day.times && (day.times.start || day.times.finish)) {
          setFont(x, 14, 600);
          x.fillText(day.times.start || '–', cx + dayW / 2, y + rowH * 0.62);
          x.fillText(day.times.finish || '–', cx + dayW / 2, y + rowH * 1.18);
          const tc = derivedCodes(day).find((cd) => cd.startsWith('230'));
          const m = minsBetween(day.times.start, day.times.finish);
          setFont(x, 12, 500); x.fillStyle = SOFT;
          x.fillText(tc || (m != null ? m + ' min' : ''), cx + dayW / 2, y + rowH * 1.75);
        }
      } else if (r.pseudo === 'asa') {
        if (day.asa) { setFont(x, 14, 700); x.fillText(day.asa + ' (' + ASA_CODES[day.asa] + ')', cx + dayW / 2, y + rowH - 8); }
      } else if (day.items.includes(r.code)) {
        drawTick(x, cx + dayW / 2, y + rowH / 2, Math.min(22, rowH * 0.75));
      }
      x.textAlign = 'left';
    });
    y += h;
    x.fillStyle = '#9aa7ab'; x.fillRect(L, y - 0.5, W, 1);
  });
  // vertical lines
  x.fillStyle = RULE;
  x.fillRect(L, top, 2.4, y - top); x.fillRect(R - 2.4, top, 2.4, y - top);
  x.fillRect(L + colCode, top, 1.6, y - top); x.fillRect(L + colCode + colDesc, top, 2, y - top);
  for (let i = 1; i < nDay; i++) x.fillRect(L + colCode + colDesc + i * dayW, top, 1, y - top);
  x.fillRect(L, y - 1.5, W, 3);

  // Notes
  let fy = y + 16;
  if (noteDays.length) {
    setFont(x, 15, 400); x.fillStyle = INK;
    const t = 'Notes: ' + noteDays.map((d) => fmtDM(d) + ' ' + byDate[d].note).join('; ');
    wrapText(x, t, W).slice(0, 3).forEach((l) => { fy += 20; x.fillText(l, L, fy); });
    fy += 10;
  }
  // Modifier legend (as on the paper form)
  fy += 8;
  setFont(x, 17, 400); x.fillStyle = INK; x.fillText('Time/ASA Modifier:', L + 30, fy + 30);
  const lx = L + 210, cw = 168, ch = 28;
  const cells = [['16 – 30 min: 23025', '31 – 45 min: 23035', '46 – 60 min: 23045'], ['61 – 75 min: 23055', '76 – 90 min: 23065', 'Other:']];
  x.strokeStyle = RULE; x.lineWidth = 1.5; setFont(x, 14.5, 400);
  cells.forEach((row, ri) => row.forEach((t, ci) => { x.strokeRect(lx + ci * cw, fy + ri * ch, cw, ch); x.fillText(t, lx + ci * cw + 10, fy + ri * ch + 20); }));
  const ax = R - 300;
  ['3: 25000', '4: 25005', '5: 25010'].forEach((t, i) => { x.strokeRect(ax + i * 100, fy + 14, 100, ch); x.fillText(t, ax + i * 100 + 14, fy + 14 + 20); });
  fy += ch * 2 + 46;
  setFont(x, 19, 700); x.fillStyle = INK;
  const nm = (S.settings.name || '').toUpperCase();
  x.fillText('Service Provided By:  ' + nm, L + 30, fy);
  x.fillText('Provider Number:  ' + (hosp.provider || ''), L + 470, fy);
  x.textAlign = 'right'; x.fillText(hosp.name.toUpperCase(), R - 30, fy); x.textAlign = 'left';
  setFont(x, 12.5, 400); x.fillStyle = SOFT;
  x.fillText('Generated by Caring Intensively on ' + fmtDMY(today()) + (pageNo ? '. ' + pageNo : ''), L + 30, PAGE_H - 26);
  return c;
}

/* Split a patient's billed days into sheets: one hospital per sheet (provider numbers differ), 7 dated columns each */
function patientSheets(dayList) {
  const ds = dayList.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const groups = [];
  ds.forEach((d) => {
    const h = dayLoc(d).hospital;
    let g = groups[groups.length - 1];
    if (!g || g.hosp !== h || g.dates.length === 7) { g = { hosp: h, dates: [] }; groups.push(g); }
    g.dates.push(d.date);
  });
  groups.forEach((g) => { while (g.dates.length < 7) g.dates.push(null); });
  return groups;
}
async function drawPatientSheets(p, dayList) {
  const groups = patientSheets(dayList); const out = [];
  for (let i = 0; i < groups.length; i++) out.push(await drawBillingSheet(p, groups[i].dates, patientName(p) + ', sheet ' + (i + 1) + ' of ' + groups.length, groups[i].hosp));
  return out;
}

function itemSummary(days) {
  const c = {};
  days.forEach((d) => dayAllCodes(d).forEach((cd) => { c[cd] = (c[cd] || 0) + 1; }));
  return Object.keys(c).sort((a, b) => c[b] - c[a] || (a < b ? -1 : 1)).map((cd) => c[cd] > 1 ? cd + ' ×' + c[cd] : cd).join(', ');
}

/* ---------- Report builders: each returns {title, filename, pages, csv?} ---------- */

  const pids = Array.from(new Set(days.map((d) => d.pid)));
  const pats = pids.map(patientById).filter(Boolean).sort((p, q) => patientName(p).localeCompare(patientName(q)));
  const title = opts.title || 'Billing for processing';
  let pages = [];
  if (opts.summary !== false) {
  const doc = new Doc(title, fmtRange(a, b));
  doc.heading(title);
  doc.para(fmtRange(a, b) + '. Prepared ' + fmtDate(today(), { year: true }) + ' by ' + S.settings.name + '.', { color: SOFT });
  doc.gap(10);
  doc.kv([['Patients', String(pats.length)], ['Patient-days', String(days.length)], ['Items', String(sum(days, (d) => dayAllCodes(d).length))], ['Provider numbers', S.settings.hospitals.map((h) => h.name + ' ' + h.provider).join('; ')]], 2);

    [{ label: 'Patient', w: 0.23 }, { label: 'Fund', w: 0.13 }, { label: 'Hospital and ward / bed', w: 0.2 }, { label: 'Dates of care', w: 0.18 }, { label: 'Items', w: 0.26 }],
    pats.map((p) => {
      const pd = days.filter((d) => d.pid === p.id).sort((u, v) => u.date < v.date ? -1 : 1);
      const hs = Array.from(new Set(pd.map((d) => hospitalById(dayLoc(d).hospital).name)));
      const wbs = []; pd.forEach((d) => { const t = wardBedShort(dayLoc(d)); if (t && wbs[wbs.length - 1] !== t) wbs.push(t); });
      return [{ t: patientName(p) + (p.ur ? '\nUR ' + p.ur : ''), bold: true }, p.fund || '–', hs.join('; ') + (wbs.length ? '\n' + wbs.join(' then ') : ''), pd.map((d) => fmtDM(d.date)).join(', '), itemSummary(pd)];
    })
  );
  const tally = {};
  days.forEach((d) => dayAllCodes(d).forEach((cd) => { tally[cd] = (tally[cd] || 0) + 1; }));
  doc.h2('Item totals');
  doc.table([{ label: 'Item', w: 0.14 }, { label: 'Description', w: 0.72 }, { label: 'Count', w: 0.14, align: 'right' }],
    Object.keys(tally).sort((p, q) => tally[q] - tally[p]).map((cd) => [cd, itemLabel(cd) || modifierLabel(cd), String(tally[cd])]));
  pages = doc.finish('Summary prepared with Caring Intensively. One form sheet per patient follows.');
  }
  if (opts.sheets !== false) {
    for (const p of pats) pages.push(...await drawPatientSheets(p, days.filter((d) => d.pid === p.id)));
  }
  const csv = billingCSV(days);
  const label = opts.fileLabel ? String(opts.fileLabel).replace(/[^A-Za-z0-9 \-]/g, '').replace(/\s+/g, ' ').trim() + ' ' : '';
  return { title, pages, filename: 'Gill billing ' + label + fileRange(a, b), csv, days, range: [a, b] };
}
function modifierLabel(cd) {
  const band = TIME_BANDS.find((b) => b.code === cd);
  if (band) return 'Anaesthesia time ' + band.min + '–' + band.max + ' min';
  const asa = Object.keys(ASA_CODES).find((k) => ASA_CODES[k] === cd);
  if (asa) return 'ASA physical status ' + asa;
  return '';
}
function fileRange(a, b) { return a === b ? fmtDMY(a).replace(/\//g, '-') : fmtDMY(a).replace(/\//g, '-') + ' to ' + fmtDMY(b).replace(/\//g, '-'); }

function billingCSV(days) {

  });
  return toCSV(rows);
}

function ecmoDetail(e) {
  const bits = [];
  if (e.mode) bits.push(e.mode);
  if (e.config) bits.push(e.config);
  if (e.role) bits.push(e.role);
  if (e.imaging && e.imaging.length) bits.push(e.imaging.join('/') + ' guided');
  if (e.setting) bits.push(e.setting);
  if (e.complication && e.complication !== 'None') bits.push('Complication: ' + e.complication);
  if (e.reason) bits.push(e.reason);
  if (e.urgency) bits.push(e.urgency);
  if (e.from || e.to) bits.push((e.from || '?') + ' to ' + (e.to || '?'));
  if (e.transport) bits.push(e.transport);
  if (e.cannulatedOnSite) bits.push('Cannulated on site');
  if (e.outcome) bits.push(e.outcome);
  if (e.referrer) bits.push('Referred by ' + e.referrer);
  if (e.kind) bits.push(e.kind);
  if (e.patients) bits.push(e.patients + ' patients');
  if (e.hours) bits.push(fmtH(e.hours) + ' h');
  if (e.topic) bits.push(e.topic);
  if (e.note) bits.push(e.note);
  return bits.join('. ');
}

/* ---------- PDF writer: one full-page JPEG per page ---------- */
function canvasJPEG(c, q = 0.8) {
  return new Promise((res) => c.toBlob(async (b) => res(new Uint8Array(await b.arrayBuffer())), 'image/jpeg', q));
}
async function pagesToPDF(pages, title) {
  const imgs = [];
  for (const c of pages) imgs.push({ bytes: await canvasJPEG(c), w: c.width, h: c.height });
  const enc = new TextEncoder();
  const chunks = []; let len = 0; const off = [];
  const push = (d) => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };
  push('%PDF-1.4\n'); push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  const obj = (n, f) => { off[n] = len; push(n + ' 0 obj\n'); f(); push('\nendobj\n'); };
  const n = imgs.length, PW = 595.28, PH = 841.89;
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push('<< /Type /Pages /Kids [' + imgs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] /Count ' + n + ' >>'));
  imgs.forEach((im, i) => {
    const pn = 3 + 3 * i;
    obj(pn, () => push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /XObject << /Im' + i + ' ' + (pn + 2) + ' 0 R >> >> /Contents ' + (pn + 1) + ' 0 R >>'));
    const cs = 'q ' + PW + ' 0 0 ' + PH + ' 0 0 cm /Im' + i + ' Do Q';
    obj(pn + 1, () => { push('<< /Length ' + cs.length + ' >>\nstream\n'); push(cs); push('\nendstream'); });
    obj(pn + 2, () => { push('<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + im.bytes.length + ' >>\nstream\n'); push(im.bytes); push('\nendstream'); });
  });
  const info = 3 + 3 * n;
  const safe = String(title || 'Report').replace(/[^\x20-\x7E]/g, '').replace(/([()\\])/g, '\\$1');
  obj(info, () => push('<< /Title (' + safe + ') /Producer (Caring Intensively) >>'));
  const xref = len;
  push('xref\n0 ' + (info + 1) + '\n0000000000 65535 f \n');
  for (let i = 1; i <= info; i++) push(String(off[i]).padStart(10, '0') + ' 00000 n \n');
  push('trailer\n<< /Size ' + (info + 1) + ' /Root 1 0 R /Info ' + info + ' 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(chunks, { type: 'application/pdf' });
}
